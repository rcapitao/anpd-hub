baseURL = "https://rcapitao.github.io/anpd-hub/"
title = "ANPD Hub"

enableRobotsTXT = true
enableGitInfo = true

# i18n: português do Brasil é o único idioma do site (todo o conteúdo é
# pt-br, servido na raiz, sem prefixo /pt-br/). Inglês e espanhol foram
# removidos por enquanto: sem conteúdo traduzido, gerar essas páginas
# só criava um seletor de idioma que levava a uma home vazia com links
# quebrados. Reative quando houver conteúdo real em /en/ ou /es/.
defaultContentLanguage = "pt-br"
defaultContentLanguageInSubdir = false

[languages]
  [languages.pt-br]
    label = "Português (Brasil)"
    weight = 1

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.tableOfContents]
    endLevel = 3
    startLevel = 1
  [markup.goldmark.renderer]
    unsafe = true

[[menu.primary]]
  name = "Índice"
  url = "docs/"
  identifier = "docs"
  weight = 10

[[menu.primary]]
  name = "Blog"
  url = "blog/"
  identifier = "blog"
  weight = 20

[[menu.primary]]
  name = "GitHub"
  url = "https://github.com/rcapitao/anpd-hub"
  identifier = "github"
  weight = 30

[params]
  description = "Monitoramento automático de novas publicações da ANPD (Agência Nacional de Proteção de Dados)."

  [params.footer]
    copyright = "© :YEAR: ANPD Hub"

  [params.social]
    github = "rcapitao/anpd-hub"

  [params.docs] # Parâmetros da seção /docs
    title = "ANPD Hub"

    darkMode = true

    prism = false

    repoURL = "https://github.com/rcapitao/anpd-hub"
    repoBranch = "main"
    editPage = true
    lastMod = true
    lastModRelative = true

    sidebarIcons = true
    breadcrumbs = true
    backToTop = true

    toc = true
    tocMobile = true
    scrollSpy = true

    descriptions = true
    titleIcon = true

    navDesc = true
    navDescTrunc = 30

    listDescTrunc = 100

    intLinkTooltip = true

  [params.flexsearch]
    enabled = true

# Índice de busca (FlexSearch) publicado como um único JSON estático,
# buscado uma vez via fetch() e cacheado pelo navegador — em vez de
# reembutido inline em cada página. Ver layouts/index.searchindex.json
# e layouts/partials/docs/footer/flexsearch.html.
[outputFormats.searchindex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "searchindex"]
