baseURL = "https://rcapitao.github.io/anpd-hub/"
title = "ANPD Hub"

enableRobotsTXT = true
enableGitInfo = true

# i18n: português do Brasil é o idioma padrão (todo o conteúdo hoje é só em
# pt-br, então fica servido na raiz, sem prefixo /pt-br/). Inglês e espanhol
# ficam configurados e com o seletor de idioma disponível na navbar, prontos
# para receber conteúdo traduzido (em /en/ e /es/) quando existir.
defaultContentLanguage = "pt-br"
defaultContentLanguageInSubdir = false

[languages]
  [languages.pt-br]
    label = "Português (Brasil)"
    weight = 1
  [languages.en]
    label = "English"
    weight = 2
  [languages.es]
    label = "Español"
    weight = 3

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.tableOfContents]
    endLevel = 3
    startLevel = 1
  [markup.goldmark.renderer]
    unsafe = true

[[menu.primary]]
  name = "Índice"
  url = "docs/"
  identifier = "docs"
  weight = 10

[[menu.primary]]
  name = "Blog"
  url = "blog/"
  identifier = "blog"
  weight = 20

[[menu.primary]]
  name = "GitHub"
  url = "https://github.com/rcapitao/anpd-hub"
  identifier = "github"
  weight = 30

[params]
  description = "Monitoramento automático de novas publicações da ANPD (Autoridade Nacional de Proteção de Dados)."

  [params.footer]
    copyright = "© :YEAR: ANPD Hub"

  [params.social]
    github = "rcapitao/anpd-hub"

  [params.docs] # Parâmetros da seção /docs
    title = "ANPD Hub"

    darkMode = true

    prism = true

    repoURL = "https://github.com/rcapitao/anpd-hub"
    repoBranch = "main"
    editPage = true
    lastMod = true
    lastModRelative = true

    sidebarIcons = true
    breadcrumbs = true
    backToTop = true

    toc = true
    tocMobile = true
    scrollSpy = true

    descriptions = true
    titleIcon = true

    navDesc = true
    navDescTrunc = 30

    listDescTrunc = 100

    intLinkTooltip = true

  [params.flexsearch]
    enabled = true
