# ANPD Hub — configuração do site (tema OINK).
# Valores-padrão do tema (params.ui.*, outputFormats, mediaTypes etc.) vêm de
# themes/oink/hugo.yaml, mesclados automaticamente pelo Hugo por baixo deste
# arquivo — aqui só ficam identidade e conteúdo específicos do ANPD Hub.

title: &siteTitle ANPD Hub
baseURL: https://rcapitao.github.io/anpd-hub/
theme: oink

defaultContentLanguage: pt-br
enableGitInfo: true
enableRobotsTXT: true
enableEmoji: true
timeZone: America/Sao_Paulo

languages:
  pt-br:
    label: Português (Brasil)
    locale: pt-BR
    weight: 1
    title: *siteTitle
    params:
      description: Monitoramento automático de novas publicações da ANPD (Autoridade Nacional de Proteção de Dados).
  en:
    label: English
    locale: en-US
    weight: 2
    title: *siteTitle
    params:
      description: Automatic monitoring of new publications from Brazil's National Data Protection Authority (ANPD).
  es:
    label: Español
    locale: es-ES
    weight: 3
    title: *siteTitle
    params:
      description: Monitoreo automático de nuevas publicaciones de la ANPD (Autoridad Nacional de Protección de Datos de Brasil).

# OINK's Markdown components depend on these three Goldmark settings.
markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

params:
  github_repo: https://github.com/rcapitao/anpd-hub
  github_branch: main
  offline_search: true
  ui:
    dark_mode: true
    section_index: cards
    blog_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups
