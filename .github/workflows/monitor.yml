name: Monitorar Central de Conteúdos da ANPD

on:
  schedule:
    # 12:00 UTC = 09:00 (horário de Brasília, UTC-3)
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor-anpd
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: "DEBUG temporario: inspecionar schema do @search"
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          URL="https://www.gov.br/anpd/++api++/pt-br/assuntos/noticias/@search"
          curl -sS -A "$UA" -H "Accept: application/json" -H "Accept-Language: pt-BR,pt;q=0.9,en;q=0.5" -o /tmp/resp.json "$URL"
          python3 debug_search_schema.py

      - name: Executar monitoramento
        id: monitor
        run: python monitor.py

      - name: Abrir Issue com o resultado
        if: steps.monitor.outputs.has_report == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "monitoramento-anpd" --color "0E8A16" \
            --description "Alertas do monitoramento automático da ANPD" 2>/dev/null || true
          gh issue create \
            --title "${{ steps.monitor.outputs.title }}" \
            --body-file report.md \
            --label "monitoramento-anpd"

      - name: Salvar estado atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ INDEX.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar estado e índice do monitoramento ANPD"
            git push
          else
            echo "Nenhuma mudança de estado a commitar."
          fi
