name: Monitorar Central de Conteúdos da ANPD

on:
  schedule:
    # 12:00 UTC = 09:00 (horário de Brasília, UTC-3)
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor-anpd
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: "DEBUG temporário: inspecionar /assuntos/noticias"
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          URL="https://www.gov.br/anpd/pt-br/assuntos/noticias"
          curl -sS -A "$UA" -H "Accept-Language: pt-BR,pt;q=0.9,en;q=0.5" -o /tmp/noticias.html "$URL"
          echo "=== TAMANHO ==="
          wc -c /tmp/noticias.html
          echo "=== OCORRENCIAS DE PADROES CONHECIDOS ==="
          for pat in "tileItem" "listing-item" "<table" "<article" "/assuntos/noticias/" "searchResults" "content-core" "__data" "window.__" "REDUX" "initialState" "Loadable"; do
            n=$(grep -o -i "$pat" /tmp/noticias.html | wc -l)
            echo "$pat: $n"
          done
          echo "=== PRIMEIRA OCORRENCIA DE /assuntos/noticias/ (link de noticia individual) COM CONTEXTO ==="
          grep -o '.\{80\}/anpd/pt-br/assuntos/noticias/[^"'"'"' ]*.\{80\}' /tmp/noticias.html | head -5
          echo "=== TRECHO POR VOLTA DE content-core (se existir) ==="
          python3 -c "
import re
html = open('/tmp/noticias.html', encoding='utf-8', errors='replace').read()
idx = html.find('content-core')
print('idx content-core:', idx)
if idx >= 0:
    print(html[max(0,idx-200):idx+3000])
else:
    print('NAO ENCONTRADO')
"

      - name: Executar monitoramento
        id: monitor
        run: python monitor.py

      - name: Abrir Issue com o resultado
        if: steps.monitor.outputs.has_report == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "monitoramento-anpd" --color "0E8A16" \
            --description "Alertas do monitoramento automático da ANPD" 2>/dev/null || true
          gh issue create \
            --title "${{ steps.monitor.outputs.title }}" \
            --body-file report.md \
            --label "monitoramento-anpd"

      - name: Salvar estado atualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ INDEX.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar estado e índice do monitoramento ANPD"
            git push
          else
            echo "Nenhuma mudança de estado a commitar."
          fi
