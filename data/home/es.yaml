sections: [hero, metrics, cards, cta]

# Los enlaces a docs/blog usan URLs absolutas a propósito: ese contenido
# solo existe en portugués (pt-br, sin prefijo en la raíz del sitio) — un
# enlace relativo aquí se resolvería bajo /es/ vía relLangURL y daría 404.
# La URL completa evita eso y lleva correctamente a la página real (en
# portugués) en lugar de un enlace roto.

hero:
  align: center
  eyebrow: "🎉 Novedad: [el sitio ya está en línea](https://rcapitao.github.io/anpd-hub/blog/anpd-hub-no-ar/)"
  title_lines:
    - words: [{ text: ANPD Hub }]
  lead: >-
    Seguimiento automático de las publicaciones oficiales de la Autoridad
    Nacional de Protección de Datos de Brasil (ANPD) — sin necesidad de
    revisar el sitio manualmente. El contenido en sí se sigue en portugués,
    directo desde la fuente.
  actions:
    - { label: Ver el índice, url: "https://rcapitao.github.io/anpd-hub/docs/", icon: fa-solid fa-book, style: primary, external: true }
    - { label: Leer el blog, url: "https://rcapitao.github.io/anpd-hub/blog/", icon: fa-solid fa-arrow-right, style: ghost, external: true }

metrics:
  eyebrow: En números
  title: Lo que ya se está monitoreando
  columns: 4
  items:
    - value: "199"
      label: Publicaciones monitoreadas
      icon: fa-solid fa-file-lines
    - value: "8"
      label: Categorías cubiertas
      icon: fa-solid fa-layer-group
    - value: "40"
      label: Noticias de la ANPD
      icon: fa-solid fa-newspaper
    - value: Diario
      label: Ciclo de verificación
      icon: fa-solid fa-arrows-rotate

cards:
  eyebrow: Categorías monitoreadas
  title: Un clic por categoría
  text: Cada página de abajo está en portugués — el idioma en que la ANPD publica.
  columns: 4
  items:
    - title: Actos Normativos (visión general)
      desc: 1 publicación
      icon: fa-solid fa-file-lines
      url: "https://rcapitao.github.io/anpd-hub/docs/atos-normativos/"
      external: true
    - title: Reglamentaciones de la ANPD
      desc: 17 publicaciones
      icon: fa-solid fa-scale-balanced
      url: "https://rcapitao.github.io/anpd-hub/docs/regulamentacoes-anpd/"
      external: true
    - title: Actos de Gestión Interna
      desc: 30 publicaciones
      icon: fa-solid fa-building-columns
      url: "https://rcapitao.github.io/anpd-hub/docs/atos-gestao-interna/"
      external: true
    - title: Decisiones Sancionadoras
      desc: 13 publicaciones
      icon: fa-solid fa-gavel
      url: "https://rcapitao.github.io/anpd-hub/docs/decisoes-processos-sancionadores/"
      external: true
    - title: Documentos Técnicos y Orientativos
      desc: 55 publicaciones
      icon: fa-solid fa-file-contract
      url: "https://rcapitao.github.io/anpd-hub/docs/documentos-tecnicos-orientativos/"
      external: true
    - title: Materiales Educativos
      desc: 12 publicaciones
      icon: fa-solid fa-graduation-cap
      url: "https://rcapitao.github.io/anpd-hub/docs/materiais-educativos-publicacoes/"
      external: true
    - title: Otros Documentos
      desc: 31 publicaciones
      icon: fa-solid fa-box-archive
      url: "https://rcapitao.github.io/anpd-hub/docs/outros-documentos-publicacoes/"
      external: true
    - title: Noticias de la ANPD
      desc: 40 noticias, con etiquetas y filtro por tema
      icon: fa-solid fa-newspaper
      url: "https://rcapitao.github.io/anpd-hub/docs/noticias/"
      external: true

cta:
  title: Código abierto, sin IA de por medio.
  text: >-
    Todo el monitoreo lo hace un script simple en Python — el contenido
    viene directo de las páginas oficiales de la ANPD en gov.br, sin
    resúmenes generados por modelos de lenguaje.
  label: Ver en GitHub
  url: https://github.com/rcapitao/anpd-hub
  style: primary
