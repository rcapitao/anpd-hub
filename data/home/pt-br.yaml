sections: [hero, metrics, cards, cta]

hero:
  align: center
  eyebrow: "🎉 Novidade: [o site foi ao ar](blog/anpd-hub-no-ar/)"
  title_lines:
    - words: [{ text: ANPD Hub }]
  lead: >-
    Acompanhamento automático das publicações oficiais da Autoridade Nacional
    de Proteção de Dados — sem precisar ficar checando o site manualmente.
  actions:
    - { label: Ver índice, url: docs/, icon: fa-solid fa-book, style: primary }
    - { label: Ler o blog, url: blog/, icon: fa-solid fa-arrow-right, style: ghost }

metrics:
  eyebrow: Em números
  title: O que já está sendo monitorado
  columns: 4
  items:
    - value: "199"
      label: Publicações monitoradas
      icon: fa-solid fa-file-lines
    - value: "8"
      label: Categorias acompanhadas
      icon: fa-solid fa-layer-group
    - value: "40"
      label: Notícias da ANPD
      icon: fa-solid fa-newspaper
    - value: Diário
      label: Ciclo de verificação
      icon: fa-solid fa-arrows-rotate

cards:
  eyebrow: Categorias monitoradas
  title: Um clique de cada categoria
  columns: 4
  items:
    - title: Atos Normativos (visão geral)
      desc: 1 publicação
      icon: fa-solid fa-file-lines
      url: docs/atos-normativos/
    - title: Regulamentações da ANPD
      desc: 17 publicações
      icon: fa-solid fa-scale-balanced
      url: docs/regulamentacoes-anpd/
    - title: Atos de Gestão Interna
      desc: 30 publicações
      icon: fa-solid fa-building-columns
      url: docs/atos-gestao-interna/
    - title: Decisões Sancionadoras
      desc: 13 publicações
      icon: fa-solid fa-gavel
      url: docs/decisoes-processos-sancionadores/
    - title: Documentos Técnicos e Orientativos
      desc: 55 publicações
      icon: fa-solid fa-file-contract
      url: docs/documentos-tecnicos-orientativos/
    - title: Materiais Educativos
      desc: 12 publicações
      icon: fa-solid fa-graduation-cap
      url: docs/materiais-educativos-publicacoes/
    - title: Outros Documentos
      desc: 31 publicações
      icon: fa-solid fa-box-archive
      url: docs/outros-documentos-publicacoes/
    - title: Notícias da ANPD
      desc: 40 publicações, com tags e filtro por tema
      icon: fa-solid fa-newspaper
      url: docs/noticias/

cta:
  title: Código aberto, sem IA no meio do caminho.
  text: >-
    Todo o monitoramento é feito por um script Python simples — o conteúdo
    vem direto das páginas oficiais da ANPD em gov.br, sem resumos gerados
    por modelos de linguagem.
  label: Ver no GitHub
  url: https://github.com/rcapitao/anpd-hub
  style: primary
