sections: [hero, metrics, cards, cta]

# Docs/blog links use absolute URLs on purpose: that content only exists in
# Portuguese (pt-br, unprefixed at the site root) — a relative link here
# would resolve under /en/ via relLangURL and 404. Full URLs bypass that
# and correctly land on the real (Portuguese) page instead of a dead link.

hero:
  align: center
  eyebrow: "🎉 New: [the site is live](https://rcapitao.github.io/anpd-hub/blog/anpd-hub-no-ar/)"
  title_lines:
    - words: [{ text: ANPD Hub }]
  lead: >-
    Automatic tracking of official publications from Brazil's National Data
    Protection Authority (ANPD) — no need to check the site by hand. The
    content itself is tracked in Portuguese, straight from the source.
  actions:
    - { label: Browse the index, url: "https://rcapitao.github.io/anpd-hub/docs/", icon: fa-solid fa-book, style: primary, external: true }
    - { label: Read the blog, url: "https://rcapitao.github.io/anpd-hub/blog/", icon: fa-solid fa-arrow-right, style: ghost, external: true }

metrics:
  eyebrow: By the numbers
  title: What is already being monitored
  columns: 4
  items:
    - value: "199"
      label: Publications tracked
      icon: fa-solid fa-file-lines
    - value: "8"
      label: Categories covered
      icon: fa-solid fa-layer-group
    - value: "40"
      label: ANPD news items
      icon: fa-solid fa-newspaper
    - value: Daily
      label: Check cycle
      icon: fa-solid fa-arrows-rotate

cards:
  eyebrow: Monitored categories
  title: One click per category
  text: Every page below is in Portuguese — the language ANPD itself publishes in.
  columns: 4
  items:
    - title: Regulatory Acts (overview)
      desc: 1 publication
      icon: fa-solid fa-file-lines
      url: "https://rcapitao.github.io/anpd-hub/docs/atos-normativos/"
      external: true
    - title: ANPD Regulations
      desc: 17 publications
      icon: fa-solid fa-scale-balanced
      url: "https://rcapitao.github.io/anpd-hub/docs/regulamentacoes-anpd/"
      external: true
    - title: Internal Management Acts
      desc: 30 publications
      icon: fa-solid fa-building-columns
      url: "https://rcapitao.github.io/anpd-hub/docs/atos-gestao-interna/"
      external: true
    - title: Sanctioning Decisions
      desc: 13 publications
      icon: fa-solid fa-gavel
      url: "https://rcapitao.github.io/anpd-hub/docs/decisoes-processos-sancionadores/"
      external: true
    - title: Technical & Guidance Documents
      desc: 55 publications
      icon: fa-solid fa-file-contract
      url: "https://rcapitao.github.io/anpd-hub/docs/documentos-tecnicos-orientativos/"
      external: true
    - title: Educational Materials
      desc: 12 publications
      icon: fa-solid fa-graduation-cap
      url: "https://rcapitao.github.io/anpd-hub/docs/materiais-educativos-publicacoes/"
      external: true
    - title: Other Documents
      desc: 31 publications
      icon: fa-solid fa-box-archive
      url: "https://rcapitao.github.io/anpd-hub/docs/outros-documentos-publicacoes/"
      external: true
    - title: ANPD News
      desc: 40 items, tagged and filterable by topic
      icon: fa-solid fa-newspaper
      url: "https://rcapitao.github.io/anpd-hub/docs/noticias/"
      external: true

cta:
  title: Open source, no AI in the loop.
  text: >-
    All monitoring runs on a simple Python script — content comes straight
    from ANPD's official gov.br pages, with no LLM-generated summaries.
  label: View on GitHub
  url: https://github.com/rcapitao/anpd-hub
  style: primary
