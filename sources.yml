# Fontes monitoradas na Central de Conteúdos da ANPD
# (https://www.gov.br/anpd/pt-br/centrais-de-conteudo).
#
# Para adicionar uma nova fonte, inclua um novo item com:
#   - name: nome amigável (aparece nas Issues)
#   - slug: identificador único, usado no nome do arquivo de estado (state/<slug>.json)
#   - url:  URL da página de listagem a ser monitorada
#   - api_portal_type (opcional): usado só se monitor.py precisar recorrer
#     ao fallback via API REST do Volto (páginas renderizadas só no
#     cliente) — filtra o @search para esse portal_type específico (ex.:
#     "News Item"), em vez de trazer todo o conteúdo recursivo da pasta.

sources:
  - name: "Atos Normativos da ANPD (visão geral)"
    slug: "atos-normativos"
    url: "https://www.gov.br/anpd/pt-br/acesso-a-informacao/institucional/atos-normativos"

  - name: "Regulamentações da ANPD"
    slug: "regulamentacoes-anpd"
    url: "https://www.gov.br/anpd/pt-br/acesso-a-informacao/institucional/atos-normativos/regulamentacoes_anpd"

  - name: "Atos de Gestão Interna"
    slug: "atos-gestao-interna"
    url: "https://www.gov.br/anpd/pt-br/acesso-a-informacao/institucional/atos-normativos/atos_gestao_interna"

  - name: "Decisões em Processos Sancionadores"
    slug: "decisoes-processos-sancionadores"
    url: "https://www.gov.br/anpd/pt-br/centrais-de-conteudo/decisoes-em-processos-sancionadores/"

  - name: "Documentos Técnicos e Orientativos"
    slug: "documentos-tecnicos-orientativos"
    url: "https://www.gov.br/anpd/pt-br/centrais-de-conteudo/documentos-tecnicos-orientativos"

  - name: "Materiais Educativos e Publicações"
    slug: "materiais-educativos-publicacoes"
    url: "https://www.gov.br/anpd/pt-br/centrais-de-conteudo/materiais-educativos-e-publicacoes"

  - name: "Outros Documentos e Publicações Institucionais"
    slug: "outros-documentos-publicacoes"
    url: "https://www.gov.br/anpd/pt-br/centrais-de-conteudo/outros-documentos-e-publicacoes-institucionais"

  - name: "Notícias da ANPD"
    slug: "noticias"
    url: "https://www.gov.br/anpd/pt-br/assuntos/noticias"
    # Página renderizada só no cliente (React); monitor.py cai no fallback
    # via API REST do Volto (++api++/@search). Sem esse filtro, o @search
    # devolve todo o conteúdo recursivo da pasta (imagens/anexos inclusos),
    # não só as notícias.
    api_portal_type: "News Item"
