{{ define "main" }}
<div class="container mt-100 mt-60">
    <article class="mx-auto" style="max-width: 760px;">
        <h1>{{ .Title }}</h1>
        <p class="text-muted small mb-3">{{ .Date.Format "02/01/2006" }}</p>
        {{ with .Params.tags }}
        <p class="mb-4">
            {{ range . }}<span class="badge bg-light text-dark me-1">#{{ . }}</span>{{ end }}
        </p>
        {{ end }}
        <div class="content">
            {{ .Content }}
        </div>
        <p class="mt-4">
            <a href="{{ "blog/" | relLangURL }}">&larr; Voltar para o blog</a>
        </p>
    </article>
</div>
{{ end }}
